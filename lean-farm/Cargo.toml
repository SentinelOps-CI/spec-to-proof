[package]
name = "lean-farm"
version = "1.0.0"
edition = "2021"
authors = ["Spec-to-Proof Team <team@spec-to-proof.com>"]
description = "A secure, horizontally scalable Kubernetes job runner for Lean theorem proving"
license = "Apache-2.0"
repository = "https://github.com/spec-to-proof/lean-farm"
keywords = ["lean", "theorem-proving", "formal-verification", "proof-farm", "kubernetes"]
categories = ["science", "system-programming"]

[dependencies]
# Shared protobuf domain types.
spec-to-proof-proto = { path = "../proto" }

# Core async runtime
tokio = { version = "1.0", features = ["full"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI argument parsing
clap = { version = "4.0", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# HTTP server (health/readiness endpoints)
axum = "0.7"

# AWS SDK for S3 (also used for S3-compatible object stores such as MinIO)
aws-sdk-s3 = "~1.40"
aws-config = "~1.5"
aws-smithy-types = "1"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# SHA256 hashing
sha2 = "0.10"
sha256 = "1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Futures utilities
futures = "0.3"

# Protobuf
prost = "0.12"
prost-types = "0.12"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "lean-farm"
path = "src/main.rs"
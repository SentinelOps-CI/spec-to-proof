# Local, AWS-free end-to-end proving stack.
#
# Brings up MinIO (S3-compatible artifact store) and creates the artifact
# bucket. The Lean Farm itself runs on the host (`cargo run` inside `lean-farm/`)
# so it can drive the host Docker daemon to launch hardened Lean sandboxes.
#
#   docker compose -f docker-compose.e2e.yml up -d
#   cd lean-farm && $env:E2E_DOCKER = "1"; cargo test --test e2e_proving_test -- --nocapture
#   docker compose -f docker-compose.e2e.yml down -v
#
# MinIO console: http://localhost:9001  (minioadmin / minioadmin)

services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: lean-farm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lean-farm-e2e

  # One-shot job that waits for MinIO and creates the artifact bucket.
  createbuckets:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: lean-farm-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/proof-artifacts;
      mc anonymous set download local/proof-artifacts;
      echo 'bucket proof-artifacts ready';
      "
    networks:
      - lean-farm-e2e

volumes:
  minio_data:
    driver: local

networks:
  lean-farm-e2e:
    driver: bridge
